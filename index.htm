<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Checklist Diário - Coordenador Administrativo</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 30px;
      background-color: #f8f9fa;
      color: #333;
      transition: all 0.3s ease-in-out;
    }
    h1 {
      text-align: center;
      color: #007bff;
      font-size: 2.5em;
      margin-bottom: 20px;
      animation: fadeIn 1s ease-out;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      animation: slideIn 1s ease-out;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: left;
      font-size: 14px;
      transition: all 0.3s ease-in-out;
    }
    th {
      background-color: #e9ecef;
      color: #007bff;
    }
    td:hover {
      background-color: #f1f1f1;
      cursor: pointer;
    }
    .form-container {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      animation: fadeInUp 1s ease-out;
    }
    .form-container label {
      font-size: 14px;
      margin-right: 10px;
      color: #333;
      width: 100%;
    }
    .form-container input, .form-container select {
      padding: 8px;
      margin-right: 15px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      transition: border-color 0.3s ease-in-out;
      margin-bottom: 10px;
      width: 48%;
    }
    .form-container input:focus, .form-container select:focus {
      border-color: #007bff;
    }
    .form-container button {
      padding: 12px 25px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      transition: all 0.3s ease-in-out;
    }
    .form-container button:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(0); }
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div style="display: flex; align-items: center; gap: 20px;">
  <img src="https://i.imgur.com/L55qh7b.png" alt="Logo" style="width: 60px; height: auto;">
  <img src="https://i.imgur.com/WzaQvTL.png" alt="Logo" style="width: 45px; height: auto;">
  <h1 style="font-size: 32px; margin: 0;">Checklist de Rotina - Assistente Administrativo</h1>
</div>
<h5>LOG-CKL-003-TBL Rev:01</h5>
<!-- Formulário de informações iniciais -->
<div class="form-container" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
  <div style="flex: 2;">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required style="width: 100%;">
  </div>

  <div style="flex: 1;">
    <label for="data">Data:</label>
    <input type="date" id="data" name="data" required style="width: 100%;">
  </div>

  <div style="flex: 1;">
    <label for="unidade">Unidade:</label>
    <select id="unidade" name="unidade" required style="width: 100%;">
      <option value="">Selecione</option>
      <option value="TCA">TCA</option>
      <option value="TCV">TCV</option>
      <option value="ABC">ABC</option>
      <option value="MCD">MCD</option>
      <option value="TBL">TBL</option>
      <option value="TPA">TPA</option>
      <option value="TBA">TBA</option>
      <option value="TSJ">TSJ</option>
      <option value="API">API</option>
      <option value="TPH">TPH</option>
      <option value="TCG">TCG</option>
    </select>
  </div>
</div>


<form id="checklistForm">
  <table>
    <thead>
      <tr>
        <th>Horário/Evento</th>
        <th>Atividade</th>
        <th>Documento de Referência</th>
        <th>Ferramenta/Maquinario</th>
        <th>Plano de Reação</th>
        <th>Sim</th>
        <th>Não</th>
      </tr>
    </thead>
    <tbody>
      <script>
        const atividades = [
          ["Ao iniciar o turno","No Fillezilla, verificar se há alguma tracking como pendente. Caso houver, alterar para OK, assim subindo para o sistema SICF de maneira correta. Tracking de PEDIDOS/ESTOQUE/LIMITE","CPD-POP-010-TBL","SICF/FILEZILLAA","ACIONAR T.I."],
          ["Após verificação de TRACKING", " Verificar se foi transmitido de maneira correta para o sistema SICF","CPD-POP-010-TBL", "SICF/FILEZILLA", "ACIONAR T.I."],
          ["Após verificação de TRACKING", " Realocar os pedidos em seu devidos movimentos de faturamento. Assim liberando que seja faturado normalmente","CPD-POP-010-TBL","SICF", "ACIONAR FATURAMENTO UNIDADE"],
          ["Diario","Enviar trackings manuais. ESTOQUE/ CLIENTES/ LIMITES,","CPD-POP-010-TBL","SICF", "ACIONAR T.I."],
          ["Diario", "Realizar suporte via Whatsapp, solicitando limites de créditos, alterando prazos e excluindo pedidos","CPD-POP-010-TBL","WHATSAPP/SICF","AUXILIAR ADM UNIDADE"],
          ["Após recebimento de produtos do fornecedor","Receber as NFs de Entrada da Logística para lançamento de cada NF no WMS e SICF","POP-CPD-003", "SICF/WMS","ACIONAR O ENCARREGADO DE LOGISTICA"],
          ["Após término do lançamento de cada NF","Gerar espelho das NFs lançadas para encaminhamento ao Gerente da Unidade e Coord. Administrativo","POP CPD 003", "SICF/Excel", "ACIONAR O ENCARREGADO DE LOGISTICA"],
          ["Diario","Dar suporte via Whatsapp, tirando dúvidas e, ajudando com solicitações e a solucionar problemas","-","WHATSAPP","ACIONAR SETOR RESPONSÁVEL"],
          ["Conforme faturamento, após a logistica","Realizar os procedimentos necessários, nos passam as nota fiscais para que assim, eu consiga emitir o borderô para carregamento","CPD-POP-009-TBL", "SICF","ACIONAR FATURAMENTO OU LOGISTICA"],
          ["Após processo de emitir borderô","Confirmar se motorista ira carregar no dia e, no WMS, realizar a emissão do MDFE para que o motorista possa carregar a mercadoria","CPD-POP-009-TBL","WMS","ACIONAR FATURAMENTO OU LOGISTICA "],
          ["Após pedidos serem liberados da Crítica","Iniciar a análise de Faturamento/Corte de mercadoria dos pedidos no SICF","CPD-POP-007-TBL","SICF/WMS","ACIONAR FATURAMENTO OU LOGISTICA"],
          ["Após análise de Faturamento/Cortes","Realizar a impressão da Relação de Carga e extração do Pré-Mapa no SICF","CPD-POP-007-TBL","SICF/WMS","ACIONAR FATURAMENTO OU LOGISTICA"],
           ["Após a extração do Pré-Mapa","Enviar ao encarregado de logistica","CPD-POP-007-TBL","SICF/WMSS","ACIONAR FATURAMENTO OU LOGISTICA"],
          ["Após o faturamento das rotas","Realizar a impressão das NFs, GRAMPEAR JUNTO AOS BOLETOS, FAZER BORDEROS E MANISFO referente a cada motorista","CPD-POP-007-TBL","SICF/WMS","ACIONAR FATURAMENTO OU LOGISTICA"],
        ["Conforme Demanda","Realizar lançamentos de cargas após faturamento","-","SICF/WMS","ACIONAR FATURAMENTO"],
        ["Conforme Demanda","Conferir as notas fiscais de trocas ou devoluções","-","VISUAL","ACIONAR LOGISTICA"],
         ["Conforme Demanda","Enviar as notas fiscais para os freiteiros de rotas","-","VISUAL","ACIONAR CPD"],
          ["Conforme Demanda","'Auxiliar o encarregado nas atividades gerais","-","-","ACIONAR LOGISTICA"],
          ["Conforme Demanda","Auxiliar no recebimento de cargas","-","-","ACIONAR LOGISTICA"],
          ["Conforme Demanda","Digitar pedidos de vendedores especificos","-","-","ACIONAR GERENTE"],
           ["Conforme Demanda","Envio de relatórios para fornecedores","-","SICF/EXCEL","ACIONAR GERENTE"],
           ]

        for (let i = 0; i < atividades.length; i++) {
          document.write(`
            <tr>
              <td>${atividades[i][0]}</td>
              <td>${atividades[i][1]}</td>
              <td>${atividades[i][2]}</td>
              <td>${atividades[i][3]}</td>
              <td>${atividades[i][4]}</td>
              <td>
                <input type="checkbox" name="atividade_${i+1}" value="Sim"
                  onclick="toggleCheckbox(event, this, 'atividade_${i+1}', 'Sim')">
              </td>
              <td>
                <input type="checkbox" name="atividade_${i+1}" value="Não"
                  onclick="toggleCheckbox(event, this, 'atividade_${i+1}', 'Não')">
              </td>
              <input type="hidden" name="hora_atividade_${i+1}">
              <input type="hidden" name="resposta_atividade_${i+1}">
            </tr>
          `);
        }
      </script>
    </tbody>
  </table>

  <div class="form-container">
    <button type="submit" id="submitBtn">Enviar</button>
  </div>
</form>

<script>
  let formularioEnviado = false;

  window.addEventListener("beforeunload", function (e) {
    if (!formularioEnviado) {
      e.preventDefault();
      e.returnValue = "Você tem certeza que deseja sair? As informações preenchidas serão perdidas.";
    }
  });

  function toggleCheckbox(event, checkbox, nomeAtividade, valorSelecionado) {
    const checkboxes = document.getElementsByName(nomeAtividade);
    checkboxes.forEach(c => {
      if (c !== checkbox) c.checked = false;
    });
    const horaCampo = document.querySelector(`[name=hora_${nomeAtividade}]`);
    const respostaCampo = document.querySelector(`[name=resposta_${nomeAtividade}]`);
    horaCampo.value = new Date().toLocaleString('pt-BR');
    respostaCampo.value = valorSelecionado;
  }

  document.getElementById("checklistForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const nome = document.getElementById("nome").value;
    const data = document.getElementById("data").value;
    const unidade = document.getElementById("unidade").value;

    if (!nome || !data || !unidade) {
      alert("Preencha todos os campos obrigatórios.");
      return;
    }

    let algumaMarcada = false;
    for (let i = 1; i <= atividades.length; i++) {
      const resposta = document.querySelector(`[name=resposta_atividade_${i}]`).value;
      if (resposta === "Sim" || resposta === "Não") {
        algumaMarcada = true;
        break;
      }
    }

    if (!algumaMarcada) {
      alert("Marque pelo menos uma atividade.");
      return;
    }

    if (!confirm("Tem certeza que deseja enviar?")) return;

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";

    const formData = new FormData(document.getElementById("checklistForm"));
    formData.append("nome", nome);
    formData.append("data", data);
    formData.append("unidade", unidade);

    fetch("https://script.google.com/macros/s/AKfycbxzwsy-Qvo-t6PI1K9NoA2uny5VhT6DL2vPjMd1rwk8lgRaibB04OeH1dqzBUsORYuJDQ/exec", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(data => {
      formularioEnviado = true;
      alert("Dados enviados com sucesso!");
      location.reload();
    })
    .catch(error => {
      alert("Erro ao enviar os dados: " + error);
      submitBtn.disabled = false;
      submitBtn.textContent = "Enviar";
    });
  });
  
</script>
<!-- Botão de ajuda discreto no final da página -->
<div style="text-align: center; margin-top: 60px; margin-bottom: 20px;">
  <a href="mailto:luis.correia@triunfante.com.br,marcelo.portella@triunfante.com.br,raphael.bortot@triunfante.com.br,daniela.nachbar@triunfante.com.br?subject=Ajuda%20-%20Checklist%20Coord%20Adm"
     style="
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #f1f1f1;
      color: #333;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 15px;
      text-decoration: none;
      border: 1px solid #ccc;
      transition: all 0.3s ease;
    "
    onmouseover="this.style.backgroundColor='#e2e2e2'"
    onmouseout="this.style.backgroundColor='#f1f1f1'">
    💬 Fale com o suporte
  </a>
</div>

<script>
  window.onload = function () {
    const dataInput = document.getElementById("data");
    // Obtém a data e hora local do dispositivo (Campinas, SP, Brasil)
    const agora = new Date(); 
    
    const ano = agora.getFullYear();
    // Mês é de 0 a 11, por isso somamos 1 e usamos padStart para ter sempre dois dígitos
    const mes = String(agora.getMonth() + 1).padStart(2, '0'); 
    // Dia do mês, com padStart para ter sempre dois dígitos
    const dia = String(agora.getDate()).padStart(2, '0');

    // Formata a data como 'YYYY-MM-DD'
    const hojeFormatado = `${ano}-${mes}-${dia}`;
    
    // Define o valor do campo data para o dia atual
    dataInput.value = hojeFormatado; 
    // Restringe a data mínima ao dia atual, impedindo seleção de datas passadas
    dataInput.min = hojeFormatado;   
    // Restringe a data máxima ao dia atual, impedindo seleção de datas futuras
    dataInput.max = hojeFormatado;   
    // Impede que o usuário digite manualmente no campo
    dataInput.readOnly = true;       
    // Impede o clique para abrir o calendário de seleção de data
    dataInput.style.pointerEvents = 'none'; 
    // Opcional: Adiciona um estilo visual para indicar que o campo está desabilitado
    dataInput.style.backgroundColor = '#e9ecef'; 
  };
</script>

</body>
</html>
